sources:
    - name: bronze
      database: AIRBNB
      schema: BRONZE
      tables:
        - name: bronze_listings
          description: "Listings table: elle contient les informations sur les biens mis en location sur Airbnb"

          columns:
            - name: listing_id
              description: "Listing id: identifiant unique du listing"
              tests:
                - not_null
                - unique

            - name: host_id
              description: "Host id: identifiant unique du host"
              tests:
                - not_null
                - relationships:
                    arguments:
                      to: source('bronze', 'bronze_hosts')
                      field: host_id

            - name: price_per_night
              description: "Prix a la nuit, en euros. Un prix nul ou negatif fausse tous les indicateurs Gold."
              tests:
                - not_null
                - dbt_utils.accepted_range:
                    arguments:
                      min_value: 1
                      max_value: 10000

            - name: accommodates
              description: "Capacite d'accueil. Sert de denominateur a price_per_person et bedroom_density."
              tests:
                - not_null
                - dbt_utils.accepted_range:
                    arguments:
                      min_value: 1
                      max_value: 30


        - name: bronze_hosts
          description: "Hosts table: elle contient les informations sur les personnes qui publient les logements."

          columns:
            - name: host_id
              description: "Host id: identifiant unique du host"
              tests:
                - not_null
                - unique

            - name: response_rate
              description: "Taux de reponse de l'hote, en pourcentage entier de 0 a 100."
              tests:
                - dbt_utils.accepted_range:
                    arguments:
                      min_value: 0
                      max_value: 100

            - name: host_since
              description: "Date d'inscription de l'hote. Ne peut pas etre dans le futur."
              tests:
                - not_null
                - dbt_utils.expression_is_true:
                    arguments:
                      expression: "<= current_date()"

        - name: bronze_bookings
          description: "Bookings table: la table transactionnelle. Elle contient les données sur les séjours réellement réservés"

          columns:
            - name: booking_id
              description: "Booking id: identifiant unique du booking, doit etre not null"
              tests:
                - not_null
                - unique

            - name: listing_id
              description: "Listing id: identifiant unique du listing"
              tests:
                - not_null
                - relationships:
                    arguments:
                      to: source('bronze', 'bronze_listings')
                      field: listing_id

            - name: booking_status
              description: "Booking status: statut de la réservation"
              tests:
                - accepted_values:
                    arguments:
                      values: ["cancelled", "confirmed"]

            - name: booking_date
              description: "Booking date: date de la réservation, doit etre not null"
              tests:
                - not_null

            - name: nights_booked
              description: "Nights booked: nombre de nuits réservées, doit etre > 0"
              tests:
                - not_null
                - dbt_utils.expression_is_true:
                    arguments:
                        expression: ">= 1"
                - dbt_utils.accepted_range:
                    arguments:
                      min_value: 1
                      max_value: 90

            - name: booking_amount
              description: "Montant du sejour, hors frais. Doit etre strictement positif."
              tests:
                - not_null
                - dbt_utils.accepted_range:
                    arguments:
                      min_value: 1
