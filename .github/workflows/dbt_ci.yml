name: dbt CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Cache pip pour éviter de retélécharger dbt-snowflake à chaque run
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dbt-snowflake-1.11.3

      - name: Install dbt
        run: |
          # Versions alignees sur le poste de developpement (dbt --version au 06/08/2026).
          # dbt 1.10 minimum est OBLIGATOIRE : models/sources/sources.yml declare ses tests
          # avec la syntaxe "arguments:", introduite en 1.10. En 1.8, "arguments" est passe
          # aux macros de test comme un parametre inconnu et la compilation echoue.
          pip install dbt-core==1.11.7 dbt-snowflake==1.11.3

      # Création du profil AVANT dbt deps
      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          Airbnb_proj_Stach_AWS_Snowflake_DBT:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: ${SNOWFLAKE_ACCOUNT}
                user: ${SNOWFLAKE_USER}
                password: ${SNOWFLAKE_PASSWORD}
                role: ${SNOWFLAKE_ROLE}
                warehouse: ${SNOWFLAKE_WAREHOUSE}
                database: ${SNOWFLAKE_DATABASE}
                schema: ${SNOWFLAKE_SCHEMA}
                threads: 4
          EOF

      - name: Install dbt packages
        working-directory: Airbnb_proj_Stach_AWS_Snowflake_DBT
        run: dbt deps

      - name: Run dbt debug
        working-directory: Airbnb_proj_Stach_AWS_Snowflake_DBT
        run: dbt debug

      # dbt build, et non "dbt run puis dbt test".
      # Motif : fact_bookings fait ref() sur dim_listings et dim_hosts, qui sont des
      # SNAPSHOTS. dbt run ne construit pas les snapshots, il ne selectionne que les
      # modeles. L'enchainement run + test echouait donc sur
      # "Object 'AIRBNB.GOLD.DIM_LISTINGS' does not exist or not authorized",
      # constate en local le 06/08/2026.
      # dbt build enchaine seeds, snapshots, modeles et tests dans l'ordre du graphe
      # de dependances : l'oubli n'est plus possible.
      - name: Build dbt project (snapshots, models, tests)
        working-directory: Airbnb_proj_Stach_AWS_Snowflake_DBT
        run: dbt build

      - name: Generate dbt documentation
        working-directory: Airbnb_proj_Stach_AWS_Snowflake_DBT
        run: dbt docs generate

      # Publication uniquement sur main pour ne pas écraser la doc de prod avec une branche PR
      - name: Publish dbt docs to GitHub Pages
        # if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./Airbnb_proj_Stach_AWS_Snowflake_DBT/target
          publish_branch: gh-pages
          force_orphan: true
          keep_files: false
          allow_empty_commit: false
          enable_jekyll: false   # Jekyll désactivé — requis pour que les assets dbt docs (JS/CSS) fonctionnent

      - name: Notify on failure
        if: failure()
        run: |
          echo "dbt CI pipeline failed on ${{ github.ref }} — commit ${{ github.sha }}"
