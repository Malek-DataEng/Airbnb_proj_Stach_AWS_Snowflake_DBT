name: Run dbt pipeline

on:
  schedule:
    # Toutes les 6 heures — évite les 288 runs/jour du cron */5 précédent
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run-dbt:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Cache pip pour éviter de retélécharger les dépendances à chaque run schedulé
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dbt-snowflake-1.11.3

      - name: Install dependencies
        run: |
          # Versions alignees sur le poste de developpement (dbt --version au 06/08/2026).
          # dbt 1.10 minimum est OBLIGATOIRE : models/sources/sources.yml declare ses tests
          # avec la syntaxe "arguments:", introduite en 1.10. En 1.8, "arguments" est passe
          # aux macros de test comme un parametre inconnu et la compilation echoue.
          pip install dbt-core==1.11.7 dbt-snowflake==1.11.3
          # snowflake-connector-python est deja inclus dans dbt-snowflake.
          # L'epinglage a 3.10.0 est retire : il datait de dbt-snowflake 1.8 et
          # entrerait en conflit avec la version exigee par dbt-snowflake 1.11.
          # Le script scripts/run_dbt_if_needed.py utilise ce connecteur, il prend
          # donc celui installe par l'adaptateur.

      # Création du profil AVANT dbt deps
      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          Airbnb_proj_Stach_AWS_Snowflake_DBT:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: ${SNOWFLAKE_ACCOUNT}
                user: ${SNOWFLAKE_USER}
                password: ${SNOWFLAKE_PASSWORD}
                role: ${SNOWFLAKE_ROLE}
                warehouse: ${SNOWFLAKE_WAREHOUSE}
                database: ${SNOWFLAKE_DATABASE}
                schema: ${SNOWFLAKE_SCHEMA}
                threads: 4
          EOF

      - name: Install dbt packages
        working-directory: Airbnb_proj_Stach_AWS_Snowflake_DBT
        run: dbt deps

      # Le script vit a la racine du depot et resout lui-meme le repertoire dbt.
      # Il ne faut donc PAS se placer dans le projet dbt avant de l'appeler.
      - name: Run pipeline if new data
        run: python scripts/run_dbt_if_needed.py

      - name: Notify on failure
        if: failure()
        run: |
          echo "dbt pipeline failed — run at ${{ github.run_id }}"
          
